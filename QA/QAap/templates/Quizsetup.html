{% extends 'base.html' %}

{% block content %}

<div class="quiz-setup">

    <h1>Start Quiz</h1>

    <p>
        Select a subject and number of questions.
    </p>

    <form
        method="GET"
        action="{% url 'start_quiz' %}"
    >

        <label>
            Select Subject
        </label>

        <select
            name="subject"
            required
        >

            <option value="">
                Select Subject
            </option>

            {% for subject in subjects %}

            <option value="{{ subject.id }}">

                {{ subject.name }}

            </option>

            {% endfor %}

        </select>

        <label>
            Number of Questions
        </label>

        <input
            type="number"
            name="number"
            min="1"
            max="50"
            value="5"
            required
        >

        <button type="submit">

            Start Quiz

        </button>

    </form>

</div>

{% endblock %}
