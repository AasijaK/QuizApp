{% extends 'base.html' %}

{% block content %}

<div class="hero">

    <h1>Admin Dashboard</h1>

    <p>
        Manage subjects for the QuizArena application.
    </p>

</div>

<div class="stats">

    <div class="stat-card">

        <h2>{{ subjects.count }}</h2>

        <p>Total Subjects</p>

    </div>

</div>

<div class="admin-actions">

    <a href="{% url 'add_subject' %}"
       class="btn">

        + Add Subject

    </a>

    <a href="{% url 'subjects' %}"
       class="btn secondary">

        Manage Subjects

    </a>

</div>

{% endblock %}
