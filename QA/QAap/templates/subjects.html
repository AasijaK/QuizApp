{% extends 'base.html' %}

{% block content %}

<div class="page-header">

    <h1>Subject Management</h1>

    <a href="{% url 'add_subject' %}"
       class="btn">

        + Add Subject

    </a>

</div>

<div class="table-container">

<table>

<thead>

<tr>

    <th>ID</th>

    <th>Subject</th>

    <th>Description</th>

    <th>Action</th>

</tr>

</thead>

<tbody>

{% for subject in subjects %}

<tr>

    <td>{{ subject.id }}</td>

    <td>{{ subject.name }}</td>

    <td>{{ subject.description }}</td>

    <td>

        <a
            href="{% url 'delete_subject' subject.id %}"
            class="delete-btn"
            onclick="return confirm('Delete this subject?')">

            Delete

        </a>

    </td>

</tr>

{% empty %}

<tr>

    <td colspan="4">
        No subjects available.
    </td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
