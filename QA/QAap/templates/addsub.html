{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h1>Add Subject</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Subject
        </button>

        <a href="{% url 'subjects' %}"
           class="btn secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
